<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Request a peer tutoring session for one of your courses.">
	<title>Request Tutoring | Peer Tutoring Hub</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<link rel="stylesheet" href="css/styles.css">
</head>
<body>
	<header>
		<nav class="navbar navbar-expand-lg hub-navbar" aria-label="Main navigation">
			<div class="container">
				<a class="navbar-brand hub-brand" href="index.html"><span class="brand-mark" aria-hidden="true">P</span>Peer Tutoring Hub</a>
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="mainNavigation">
					<ul class="navbar-nav ms-auto align-items-lg-center gap-lg-4">
						<li class="nav-item"><a class="nav-link" href="tutors.html">Meet the tutors</a></li>
						<li class="nav-item"><a class="btn btn-hub" href="request-form.html" aria-current="page">Request tutoring</a></li>
					</ul>
				</div>
			</div>
		</nav>
	</header>

	<main class="container py-5">
		<div class="row justify-content-center">
			<div class="col-lg-9 col-xl-8">
				<h1 class="display-4 mb-3">Request a tutoring session</h1>
				<p class="lead mb-4">Tell us what you’re studying and when you’re available. A peer tutor can help you take the next step.</p>

				<form action="process-request.php" method="post">
					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label" for="student-name">Student name</label>
							<input class="form-control" type="text" id="student-name" name="student_name" autocomplete="name" required>
						</div>
						<div class="col-md-6">
							<label class="form-label" for="student-email">Email address</label>
							<input class="form-control" type="email" id="student-email" name="student_email" autocomplete="email" required>
						</div>
						<div class="col-12">
							<label class="form-label" for="course-name">Course you need help with</label>
							<input class="form-control" type="text" id="course-name" name="course_name" placeholder="For example, Introduction to Biology" required>
						</div>
						<div class="col-md-6">
							<label class="form-label" for="preferred-date">Preferred date</label>
							<input class="form-control" type="date" id="preferred-date" name="preferred_date" required>
						</div>
						<div class="col-md-6">
							<label class="form-label" for="preferred-time">Preferred time</label>
							<select class="form-select" id="preferred-time" name="preferred_time" required>
								<option value="" selected disabled>Select a time</option>
								<option value="morning">Morning</option>
								<option value="afternoon">Afternoon</option>
								<option value="evening">Evening</option>
							</select>
						</div>
						<div class="col-12">
							<label class="form-label" for="session-notes">What would you like help with? <span class="text-secondary">(optional)</span></label>
							<textarea class="form-control" id="session-notes" name="session_notes" rows="4" placeholder="Share a topic, question, or goal for your session."></textarea>
						</div>
						<div class="col-12 pt-2">
							<button class="btn btn-hub btn-lg" type="submit">Request Session</button>
						</div>
					</div>
				</form>
			</div>
		</div>
	</main>

	<footer class="hub-footer py-3">
		<div class="container"><p class="mb-0">Peer Tutoring Hub <span aria-hidden="true">·</span> Learning is better shared.</p></div>
	</footer>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
